# Monta o instalador e o manual no Windows e publica o release v<VERSAO> quando o arquivo
# VERSAO ou as notas mudam. Se esse release já existe, não faz nada. As notas ficam em .github/notas/v<VERSAO>.md.
name: Instalador

on:
  push:
    paths: ["VERSAO", ".github/notas/**"]

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: versao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v" + (Get-Content VERSAO -Raw).Trim()
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view $tag 2>$null
          "existe=$([int]($LASTEXITCODE -eq 0))" >> $env:GITHUB_OUTPUT
          exit 0

      - uses: actions/setup-python@v5
        if: steps.versao.outputs.existe == '0'
        with:
          python-version: "3.11"

      - name: Dependências
        if: steps.versao.outputs.existe == '0'
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt reportlab

      - name: Modelos de fala (release modelos-1)
        if: steps.versao.outputs.existe == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download modelos-1 --pattern "*.zip" --dir _baixado
          Expand-Archive (Get-ChildItem _baixado\*.zip)[0].FullName -DestinationPath _modelos
          $raiz = (Get-ChildItem _modelos -Recurse -Directory -Filter vosk-pt)[0].Parent.FullName
          Move-Item "$raiz\vosk-pt" modelos\
          Move-Item "$raiz\sherpa-pt" modelos\
          Get-ChildItem modelos

      - name: Testes
        if: steps.versao.outputs.existe == '0'
        run: .venv\Scripts\python -m pytest -q

      - name: Empacotar
        if: steps.versao.outputs.existe == '0'
        shell: cmd
        run: call empacotar.bat

      - name: Instalador
        if: steps.versao.outputs.existe == '0'
        run: .venv\Scripts\python instalador\montar.py

      - name: Manual
        if: steps.versao.outputs.existe == '0'
        run: .venv\Scripts\python manual\manual.py

      - name: Publicar o release
        if: steps.versao.outputs.existe == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.versao.outputs.tag }}"
          gh release create $tag "dist\Instalar Escriba.exe" "dist\Manual do Escriba.pdf" `
            --target $env:GITHUB_SHA --title "Escriba $($tag.TrimStart('v'))" --notes-file ".github\notas\$tag.md"
